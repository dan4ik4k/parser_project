<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | CRM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glass-background"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-icon">⚡</span>
                <h1>CRM <span>B2B Sales</span></h1>
            </div>
            <p class="auth-subtitle">Создайте аккаунт менеджера</p>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register{% if ref %}?ref={{ ref }}{% endif %}" class="auth-form">
                <div class="form-group">
                    <label for="display_name">Имя и Фамилия *</label>
                    <input type="text" id="display_name" name="display_name" placeholder="Иван Иванов" required>
                </div>
                <div class="form-group">
                    <label for="username">Логин *</label>
                    <input type="text" id="username" name="username" placeholder="Придумайте логин" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" placeholder="Не менее 6 символов" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="contact">Telegram / Телефон</label>
                    <input type="text" id="contact" name="contact" placeholder="@telegram или +7...">
                </div>
                <input type="hidden" name="referred_by" value="{{ ref }}">
                {% if ref %}
                <div class="ref-badge">Вас пригласил: <strong>{{ ref }}</strong></div>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
            </form>

            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
            </div>
        </div>
    </div>
</body>
</html>
