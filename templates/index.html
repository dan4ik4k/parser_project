<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лиды | CRM Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="glass-background"></div>
    
    <div class="container">
        <header>
            <h1>База Лидов <span>B2B Sales</span></h1>
            
            <div class="controls">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Поиск по названию или телефону...">
                </div>
                <div class="filter-box">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="noWebsiteFilter">
                        <span class="checkmark"></span>
                        Только без сайта
                    </label>
                </div>
                <div class="stats">
                    Всего карточек: <span id="totalCount">0</span>
                </div>
            </div>
        </header>

        <main>
            <div class="table-container">
                <table id="leadsTable">
                    <thead>
                        <tr>
                            <th>Название и Адрес</th>
                            <th>Рейтинг</th>
                            <th>Телефон</th>
                            <th>Сайт компании</th>
                            <th>Яндекс Карты</th>
                            <th>Статус звонка (ML)</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Контент загружается через JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
